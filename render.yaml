services:
  - type: web
    name: fx-market-brain
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-6
      - key: DEFAULT_INSTRUMENT
        value: NAS100
      - key: ADMIN_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
